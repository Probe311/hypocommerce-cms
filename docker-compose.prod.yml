services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - backend_net

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env.prod
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
      DB_HOST: db
    read_only: true
    tmpfs:
      - /tmp
      - /app/var/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/health')!==false ? 0 : 1);"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - backend_net

volumes:
  db_data:

networks:
  backend_net:
