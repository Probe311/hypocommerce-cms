<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Admin e-commerce</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/admin/styles.css">
</head>
<body class="bg-slate-950 text-slate-50">
<div class="layout">
  <aside class="sidebar">
    <h1 class="logo">Shop Admin</h1>
    <nav>
      <a href="#" class="nav-item active">Dashboard</a>
      <a href="#" class="nav-item">Produits</a>
      <a href="#" class="nav-item">Commandes</a>
      <a href="#" class="nav-item">Clients</a>
      <a href="#" class="nav-item">Pages</a>
      <a href="#" class="nav-item">Paramètres</a>
    </nav>
  </aside>
  <main class="content">
    <header class="topbar">
      <div class="topbar-title">Dashboard</div>
      <div class="topbar-user">Admin</div>
    </header>
    <section class="cards">
      <article class="card">
        <h2>Chiffre d'affaire (jour)</h2>
        <p class="metric">0 €</p>
      </article>
      <article class="card">
        <h2>Commandes en attente</h2>
        <p class="metric">0</p>
      </article>
      <article class="card">
        <h2>Clients</h2>
        <p class="metric">0</p>
      </article>
    </section>
  </main>
</div>
</body>
</html>
